<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CamGrid</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:white;font:22px sans-serif}header{height:70px;display:flex;align-items:center;gap:15px;padding:10px 20px;background:#141c29}button,select,input{font:inherit;background:#202b3b;color:white;border:2px solid #8294a8;border-radius:6px;padding:9px}button:focus,input:focus,select:focus{outline:4px solid #4feaa7}button{cursor:pointer}.spacer{flex:1}#grid{display:grid;gap:5px;height:calc(100vh - 70px);padding:5px;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}#grid.v1{grid-template-columns:1fr;grid-template-rows:1fr}#grid.v2{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr}.tile{position:relative;background:#111923;overflow:hidden;min-width:0;min-height:0}.tile.hidden{display:none}.tile video,.tile canvas{width:100%;height:100%;object-fit:contain}.tile [hidden]{display:none}.name,.status{position:absolute;left:10px;background:#000b;padding:5px 9px}.name{top:10px}.status{bottom:10px}#settings{position:fixed;inset:4%;overflow:auto;background:#121d2b;border:2px solid #8ca0b5;padding:24px;z-index:5}#settings[hidden]{display:none}.row{display:grid;grid-template-columns:170px 1fr;gap:10px;margin:14px 0}.row input{width:100%}.hint{font-size:16px;color:#b9c9d5}#message{color:#ffbf80;font-size:16px}
</style></head><body><header><b>CamGrid</b><button id="view">Vista: 4</button><span class="spacer"></span><button id="settingsOpen">Configuración</button></header><main id="grid" class="v4"></main><section id="settings" hidden><h2>Cámaras y vista inicial</h2><p class="hint">Dejá vacío cualquier espacio que no uses. Las direcciones se guardan en este televisor e incluyen credenciales si las escribís.</p><div id="fields"></div><label>Vista al abrir <select id="defaultView"><option value="1">1 cámara</option><option value="2">2 cámaras</option><option value="3">3 cámaras</option><option value="4">4 cámaras</option></select></label><p id="message"></p><p><button id="save">Guardar y mostrar</button> <button id="cancel">Cancelar</button></p></section><script src="js/webOSTV.js"></script><script src="js/app.js"></script></body></html>
