<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CamGrid</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:white;font:22px sans-serif}header{position:fixed;right:15px;top:15px;z-index:2;opacity:0;transition:opacity .35s ease;pointer-events:none}body.controls-visible header{opacity:1;pointer-events:auto}body.controls-visible header button:focus{outline:4px solid #4feaa7}button,input{font:inherit;background:#202b3b;color:white;border:2px solid #8294a8;border-radius:6px;padding:9px}button:focus,input:focus{outline:4px solid #4feaa7}button{cursor:pointer}#grid{position:fixed;inset:0;background:#111923}#video{width:100%;height:100%;object-fit:contain}.name,.status{position:absolute;left:10px;background:#000b;padding:5px 9px}.name{top:10px;opacity:0;transition:opacity .35s ease}body.controls-visible .name{opacity:1}.status{bottom:10px}#settings{position:fixed;inset:4%;overflow:auto;background:#121d2b;border:2px solid #8ca0b5;padding:24px;z-index:5}#settings[hidden]{display:none}.row{display:grid;grid-template-columns:170px 1fr;gap:10px;margin:14px 0}.row input{width:100%}.hint{font-size:16px;color:#b9c9d5}#message{color:#ffbf80;font-size:16px}
</style></head><body><header><button id="settingsOpen">Configuración</button></header><main id="grid"><video id="video" muted playsinline></video><div id="name" class="name"></div><div id="status" class="status"></div></main><section id="settings" hidden><h2>Cámaras</h2><p class="hint">Dejá vacío cualquier espacio que no uses. Las direcciones se guardan en este televisor e incluyen credenciales si las escribís. Usá los botones 1, 2, 3 y 4 del control para cambiar de cámara.</p><div id="fields"></div><p id="message"></p><p><button id="save">Guardar y mostrar</button> <button id="cancel">Cancelar</button></p></section><script src="js/webOSTV.js"></script><script src="js/app.js"></script></body></html>
